version 15.5
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
hostname R5
boot-start-marker
boot-end-marker
no aaa new-model
bsd-client server url https://cloudsso.cisco.com/as/token.oauth2
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
ip domain name test
ip cef
no ipv6 cef
multilink bundle-name authenticated
cts logging verbose
username admin privilege 15 secret 5 $1$KG5e$B5MTd31DFGmn5wbuT1O2k.
redundancy
interface Ethernet0/0
 ip address dhcp
interface Ethernet0/1
 no ip address
 shutdown
interface Ethernet0/2
 no ip address
 shutdown
interface Ethernet0/3
 no ip address
 shutdown
ip forward-protocol nd
no ip http server
no ip http secure-server
control-plane
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login local
 transport input ssh
end
